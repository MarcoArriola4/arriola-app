# Revisión de expedientes en MARCanet (IMPI).
# Si hay una búsqueda completa en curso, revisa marcas sin parar (~5 h por bloque) hasta terminar todas;
# al terminar espera 7 días y vuelve a empezar. Cada 7 días revisa también las contestaciones vendidas que aún no se presentan.
# Desde la app se puede pedir una búsqueda o esa revisión de contestaciones: aquí se toma en ≤15 min.
name: MARCanet

on:
  schedule:
    # Cada 15 minutos revisa si hay algo que hacer (búsqueda en curso, solicitada desde la app o la revisión semanal);
    # si no, termina en segundos. Los bloques largos (5 h) se encadenan solos hasta terminar.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: marcanet
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # para mantener activa esta tarea (ver último paso)

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultar MARCanet
        run: npm run marcanet:ciclo -- --horas=5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL }}
      # GitHub apaga las tareas programadas de repositorios públicos tras 60 días sin cambios;
      # volver a habilitarla en cada corrida la mantiene activa sin necesidad de subir código.
      - name: Mantener activa la revisión automática
        if: always()
        run: gh workflow enable marcanet.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
